spring.application.name=ms-contenidos
server.port=8081
server.address=127.0.0.1
spring.datasource.url=${CORPALIV_CONTENIDOS_DB_URL:jdbc:mysql://localhost:3306/corpaliv_contenidos}
spring.datasource.username=${CORPALIV_CONTENIDOS_DB_USER}
spring.datasource.password=${CORPALIV_CONTENIDOS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
management.health.db.enabled=false
